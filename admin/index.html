<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071310">
  <title>NOVIX Admin</title>
  <link rel="icon" href="worker/favicon.ico?v=3" sizes="any">
  <link rel="icon" type="image/svg+xml" href="worker/icon.svg?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="worker/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="64x64" href="worker/favicon-64.png?v=3">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="worker/icon-192.png?v=3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NOVIX Admin">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>
    try {
      var t = localStorage.getItem('nx.admin.theme'), l = localStorage.getItem('nx.admin.lang') || 'ar';
      if (t) document.documentElement.dataset.theme = t;
      document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    } catch (e) {}
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__nxIP = e; window.dispatchEvent(new Event('nx-installable')); });
  </script>
  <link rel="stylesheet" href="../assets/css/fonts.css" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="admin.css">
  <script src="../assets/js/nx-config.js"></script>
</head>
<body>
  <div class="aurora"><i></i><i></i><i></i></div>
  <div id="root"><div class="gate"><div class="spin"></div></div></div>
  <script type="module" src="admin.js"></script>
</body>
</html>
